---
- name: Install MySQL packages
  ansible.builtin.apt:
    name: "{{ mysql_packages }}"
    state: present
    update_cache: true

- name: Check whether MySQL is already installed
  ansible.builtin.command:
    cmd: mysql --version
  register: mysql_installation_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Ensure MySQL service is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ mysql_service_name }}"
    enabled: true
    state: started
  when:
    - not ansible_check_mode or mysql_installation_check.rc == 0

- name: Ensure MySQL databases exist
  ansible.mysql.mysql_db:
    name: "{{ item.name }}"
    state: "{{ item.state | default('present') }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
  loop: "{{ mysql_databases }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not ansible_check_mode or mysql_installation_check.rc == 0

- name: Ensure MySQL users exist
  ansible.mysql.mysql_user:
    name: "{{ item.name }}"
    host: "{{ item.host | default('localhost') }}"
    password: "{{ vault_mysql_users[item.name].password }}"
    priv: "{{ item.database }}.*:{{ item.privileges | default('ALL') }}"
    state: "{{ item.state | default('present') }}"
    login_unix_socket: /var/run/mysqld/mysqld.sock
  loop: "{{ mysql_users }}"
  loop_control:
    label: "{{ item.name }}@{{ item.host | default('localhost') }}"
  when:
    - not ansible_check_mode or mysql_installation_check.rc == 0
  no_log: true