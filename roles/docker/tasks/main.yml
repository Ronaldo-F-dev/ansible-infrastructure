---

- name: Validate Docker host platform
  ansible.builtin.assert:
    that:
      - ansible_facts["distribution"] == "Ubuntu"
      - ansible_facts["architecture"] in docker_architecture_map
    fail_msg: >-
      Unsupported Docker host platform:
      {{ ansible_facts["distribution"] }}
      {{ ansible_facts["distribution_version"] }}
      ({{ ansible_facts["architecture"] }}).
      This role currently supports Ubuntu on
      {{ docker_architecture_map.keys() | list | join(', ') }}.
    success_msg: >-
      Docker host platform is supported:
      {{ ansible_facts["distribution"] }}
      {{ ansible_facts["distribution_version"] }}
      ({{ ansible_facts["architecture"] }}).

- name: Install Docker APT dependencies
  ansible.builtin.apt:
    name: "{{ docker_apt_dependencies }}"
    state: present
    update_cache: true
  when: ansible_facts["os_family"] == "Debian"

- name: Ensure APT keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker APT signing key
  ansible.builtin.get_url:
    url: "{{ docker_apt_key_url }}"
    dest: "{{ docker_apt_key_path }}"
    owner: root
    group: root
    mode: "0644"
  register: docker_signing_key

- name: Add Docker APT repository
  ansible.builtin.deb822_repository:
    name: docker
    types:
      - deb
    uris:
      - "{{ docker_apt_repository_url }}"
    suites:
      - "{{ ansible_facts['distribution_release'] }}"
    components:
      - stable
    architectures:
      - "{{ docker_architecture_map[ansible_facts['architecture']] }}"
    signed_by: "{{ docker_apt_key_path }}"
    state: present
  register: docker_repository

- name: Update APT cache after adding Docker repository
  ansible.builtin.apt:
    update_cache: true
  when:
    - docker_repository.changed or docker_signing_key.changed

- name: Check whether Docker is already installed
  ansible.builtin.command:
    cmd: docker --version
  register: docker_installation_check
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present

- name: Ensure Docker service is enabled and running
  ansible.builtin.systemd_service:
    name: "{{ docker_service_name }}"
    enabled: true
    state: started
  when:
    - not ansible_check_mode or docker_installation_check.rc == 0

- name: Add configured users to Docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups:
      - docker
    append: true
  loop: "{{ docker_users }}"
  loop_control:
    label: "{{ item }}"