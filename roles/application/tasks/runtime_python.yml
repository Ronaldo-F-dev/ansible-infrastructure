---
- name: Install Python runtime packages
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-pip
    state: present
    update_cache: true
  loop: "{{ applications }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.state | default('present') == 'present'
    - item.runtime is defined
    - item.runtime.type == 'python'

- name: Create Python virtual environment for release
  ansible.builtin.command:
    cmd: >-
      python3 -m venv
      {{ item.item.deploy_path }}/{{ application_releases_dir_name }}/{{ item.stdout }}/.venv
    creates: >-
      {{ item.item.deploy_path }}/{{ application_releases_dir_name }}/{{ item.stdout }}/.venv/bin/python
  loop: "{{ application_git_revisions.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.stdout is defined
    - item.rc is defined
    - item.rc == 0
    - item.item.state | default('present') == 'present'
    - item.item.runtime is defined
    - item.item.runtime.type == 'python'

- name: Install Python dependencies for release
  ansible.builtin.pip:
    requirements: >-
      {{ item.item.deploy_path }}/{{ application_releases_dir_name }}/{{ item.stdout }}/requirements.txt
    virtualenv: >-
      {{ item.item.deploy_path }}/{{ application_releases_dir_name }}/{{ item.stdout }}/.venv
  loop: "{{ application_git_revisions.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  register: python_dependency_installations
  when:
    - item.stdout is defined
    - item.rc is defined
    - item.rc == 0
    - item.item.state | default('present') == 'present'
    - item.item.runtime is defined
    - item.item.runtime.type == 'python'