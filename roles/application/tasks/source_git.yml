---
- name: Deploy application source from Git
  ansible.builtin.git:
    repo: "{{ item.source.repo }}"
    dest: "{{ item.deploy_path }}"
    version: "{{ item.source.version | default('main') }}"
    update: true
  loop: "{{ applications }}"
  loop_control:
    label: "{{ item.name }}"
  register: application_git_deployments
  when:
    - item.state | default('present') == 'present'
    - item.source is defined
    - item.source.type == 'git'

- name: Get deployed Git revision
  ansible.builtin.command:
    cmd: "git -C {{ item.deploy_path }} rev-parse HEAD"
  loop: "{{ applications }}"
  loop_control:
    label: "{{ item.name }}"
  register: application_git_revisions
  changed_when: false
  when:
    - item.state | default('present') == 'present'
    - item.source is defined
    - item.source.type == 'git'

- name: Create immutable Git release
  ansible.builtin.git:
    repo: "{{ item.item.source.repo }}"
    dest: "{{ item.item.deploy_path }}/{{ application_releases_dir_name }}/{{ item.stdout }}"
    version: "{{ item.stdout }}"
    update: false
  loop: "{{ application_git_revisions.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.stdout is defined
    - item.rc is defined
    - item.rc == 0

- name: Read previous current release
  ansible.builtin.command:
    cmd: "readlink {{ item.item.deploy_path }}/{{ application_current_link_name }}"
  loop: "{{ application_git_revisions.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  register: application_previous_releases
  changed_when: false
  failed_when: false
  when:
    - item.stdout is defined
    - item.rc is defined
    - item.rc == 0

- name: Point current symlink to deployed release
  ansible.builtin.file:
    src: "{{ application_releases_dir_name }}/{{ item.stdout }}"
    dest: "{{ item.item.deploy_path }}/{{ application_current_link_name }}"
    state: link
    force: true
  loop: "{{ application_git_revisions.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.stdout is defined
    - item.rc is defined
    - item.rc == 0