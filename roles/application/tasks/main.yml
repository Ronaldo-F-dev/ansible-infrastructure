---
- name: Prepare application environments
  ansible.builtin.include_tasks: prepare.yml

- name: Deploy Git application sources
  ansible.builtin.include_tasks: source_git.yml

- name: Configure Python application runtimes
  ansible.builtin.include_tasks: runtime_python.yml

- name: Configure Node.js application runtimes
  ansible.builtin.include_tasks: runtime_node.yml

- name: Activate prepared application releases
  ansible.builtin.include_tasks: activate_release.yml

- name: Configure Python application services
  ansible.builtin.include_tasks: service_python.yml

- name: Configure Node.js application services
  ansible.builtin.include_tasks: service_node.yml

- name: Validate Python application health
  ansible.builtin.include_tasks: health_python.yml
  loop: "{{ applications }}"
  loop_control:
    loop_var: application
    label: "{{ application.name }}"
  when:
    - not ansible_check_mode
    - application.state | default('present') == 'present'
    - application.runtime is defined
    - application.runtime.type == 'python'
- name: Clean old application releases
  ansible.builtin.include_tasks: cleanup_releases.yml