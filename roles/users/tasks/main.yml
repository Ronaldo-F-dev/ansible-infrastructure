---
- name: Manage system users
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: "{{ item.shell | default('/bin/bash') }}"
    create_home: "{{ item.create_home | default(true) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ system_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Configure sudo access
  ansible.builtin.copy:
    content: "{{ item.name }} ALL=(ALL) NOPASSWD: ALL\n"
    dest: "/etc/sudoers.d/{{ item.name }}"
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
  loop: "{{ system_users }}"
  when:
    - item.state | default('present') == 'present'
    - item.sudo | default(false) | bool
  loop_control:
    label: "{{ item.name }}"


- name: Remove sudo access when disabled
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ item.name }}"
    state: absent
  loop: "{{ system_users }}"
  when:
    - not (item.sudo | default(false) | bool)
  loop_control:
    label: "{{ item.name }}"

- name: Install user SSH public keys
  ansible.posix.authorized_key:
    user: "{{ item.0.name }}"
    key: "{{ lookup('file', item.1 | expanduser) }}"
    state: present
  loop: "{{ system_users | subelements('ssh_public_keys', skip_missing=True) }}"
  when:
    - item.0.state | default('present') == 'present'
  loop_control:
    label: "{{ item.0.name }}"