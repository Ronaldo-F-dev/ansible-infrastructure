---
- name: Bootstrap servers
  hosts: all
  become: true

  vars:
    ansible_admin_user: ansible
    ansible_admin_shell: /bin/bash
    ansible_admin_public_key: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/id_ed25519.pub') }}"

  tasks:
    - name: Create Ansible administration user
      ansible.builtin.user:
        name: "{{ ansible_admin_user }}"
        shell: "{{ ansible_admin_shell }}"
        create_home: true
        state: present

    - name: Install Ansible administration SSH key
      ansible.posix.authorized_key:
        user: "{{ ansible_admin_user }}"
        key: "{{ ansible_admin_public_key }}"
        state: present

    - name: Grant passwordless sudo to Ansible administration user
      ansible.builtin.copy:
        content: "{{ ansible_admin_user }} ALL=(ALL) NOPASSWD: ALL\n"
        dest: "/etc/sudoers.d/{{ ansible_admin_user }}"
        owner: root
        group: root
        mode: "0440"
        validate: "/usr/sbin/visudo -cf %s"