---
applications:
  - name: ansible-demo-app
    user: ansible-demo-app
    group: ansible-demo-app
    deploy_path: /opt/apps/ansible-demo-app

    source:
      type: git
      repo: "https://github.com/Ronaldo-F-dev/ansible-demo-app.git"
      version: main

    runtime:
      type: python
      module: app:app
      bind: 127.0.0.1:8000
      workers: 3
      health_path: /health


    state: present

    web:
      enabled: true
      server_name: ansible-demo.local
      upstream: 127.0.0.1:8000